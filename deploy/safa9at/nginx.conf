# safa9at.ma : app web, API (tenders_api sous /api) et téléchargement de l'APK.
# Installé par install.sh dans /etc/nginx/sites-available/safa9at.conf ;
# certbot y ajoute ensuite le HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root /var/www/safa9at;
    index index.html;
    client_max_body_size 1m;

    # API et santé du serveur (pm2 « safa9at-api », port 4100).
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un résumé IA peut prendre quelques dizaines de secondes.
        proxy_read_timeout 120s;
    }
    location = /health {
        proxy_pass http://127.0.0.1:4100;
    }

    # APK à télécharger : https://__DOMAIN__/safa9at.apk
    location ~* \.apk$ {
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache";
        add_header Content-Disposition "attachment";
    }

    location ~* \.wasm$ {
        types { application/wasm wasm; }
        expires 7d;
    }

    # Fichiers d'entrée de l'app web : toujours la dernière version.
    location ~ ^/(index\.html|flutter_bootstrap\.js|manifest\.json|version\.json)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
}
